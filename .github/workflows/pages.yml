name: Publicar web (GitHub Pages)

# Requiere Settings → Pages → Source: "GitHub Actions".
# Se publica solo en cada cambio que llega a `main`; también se puede lanzar a mano desde la pestaña Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Dos trabajos, como en la plantilla oficial de GitHub: `deploy-pages` busca el artefacto por la API, y si se sube en el mismo
  # trabajo a veces aún no aparece («No artifacts named "github-pages" were found»; falló así dos veces el 22/11).
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Los deportes se publican como paquetes firmados junto a la web (ver docs/PLAN_DEPORTES_MODULARES.md §3). Sin el secreto DS_CLAVE_PRIVADA no se publica ninguno.
      - run: npx tsx tools/publicar-deportes.ts apps/web/dist
        env:
          DS_CLAVE_PRIVADA: ${{ secrets.DS_CLAVE_PRIVADA }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
